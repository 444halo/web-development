    <nav>

    <main>
      <h1>CAREER GOALS</h1>

      <div class="container">

        <div style="grid-area: pic;" class="pic">
          <img src="360_F_1595469006_thsB4C3KjvApEFWTViMFIT3p3vBhtxVk.jpg">
        </div>

        <div style="grid-area: audio;" class="audio">
          <audio src="C AR A_M4TH.mp3" controls>Minecraft breakcore remix</audio>
        </div>

        <div style="grid-area: video;" class="video">
          <video src="CARA_M4TH - bxnwxghxrn (1080p).mp4" controls>Same minecraft breakcore remix but video version</video>
        </div>
      
        <div style="grid-area: form;">
          <h1>Contact Me</h1>
          <form action="https://wp.zybooks.com/form-viewer.php" method="GET">
            <div>
              <label for="fname">First name:</label>
              <input id="fname" type="text" name="first name">
            </div>
            <br>
            <div>
              <label for="lname">Last name:</label>
              <input id="lname" type="text" name="last name">
            </div>
            <br>
            <div>
              <label for="cname">Company name:</label>
              <input id="cname" type="text" name="company name">
            </div>
            <br>
            <div>
              <label for="email">Email address:</label>
              <input id="email" type="email" name="email" placeholder="johndoe1@gmail.com">
            </div>
            <br>
            <div>
              <label for="tel">Phone number:</label>
              <input id="tel" type="tel" name="phone number" placeholder="(123)456-7890">
            </div>
            <br>
            <div>
              <label for="message">Message:</label>
              <textarea id="message" name="message" placeholder="Type your message here..."></textarea>
            </div>
            <br>
            <div>
             <label for="time">Best contact time:</label>
              <br>
              <label for="a.m.">a.m.</label>
              <input class="radio" id="a.m." type="radio" name="contact time" value="a.m.">

              <label for="p.m.">p.m.</label>
              <input class="radio" id="p.m." type="radio" name="contact time" value="p.m.">

              <label for="anytime">anytime</label>
              <input class="radio" id="anytime" type="radio" name="contact time" value="anytime">
           </div>
            <br>
            <div>
              <label for="contact">Best contact:</label>
              <select id="contact" name="contact">
                <option value="phone">phone</option>
                <option value="email">email</option>
                <option value="text">text</option>
              </select>
            </div>
            <br>
            <div>
              <input id="submit" type="submit">
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer></footer>
